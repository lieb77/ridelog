ridelog.montly:
  path: '/bike/ridelog/montly'
  defaults:
    _title: 'Stats'
    _controller: '\Drupal\ridelog\Controller\RidelogController:montly'
  requirements:
    _permission: 'access content'

ridelog.yearly:
  path: '/bike/ridelog/yearly'
  defaults:
    _title: 'Stats'
    _controller: '\Drupal\ridelog\Controller\RidelogController:yearly'
  requirements:
    _permission: 'access content'

