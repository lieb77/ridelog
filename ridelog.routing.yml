ridelog.monthly:
  path: '/bike/ridelog/monthly'
  defaults:
    _title: 'Ridelog'
    _controller: '\Drupal\ridelog\Controller\RidelogController:monthly'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

ridelog.yearly:
  path: '/bike/ridelog/yearly'
  defaults:
    _title: 'Ridelog'
    _controller: '\Drupal\ridelog\Controller\RidelogController:yearly'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

ridelog.years:
  path: '/bike/ridelog/years'
  defaults:
    _title: 'Ridelog'
    _controller: '\Drupal\ridelog\Controller\RidelogController:years'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

ridelog.next:
  path: '/bike/ridelog/nextyear'
  defaults:
    _title: 'Ridelog'
    _controller: '\Drupal\ridelog\Controller\RidelogController:nextyear'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'
    _htmx_route: true

ridelog.form:
  path: '/bike/ridelog/form'
  defaults:
    _title: 'Ridelog'
    _form: '\Drupal\ridelog\Form\RideLogForm'
  requirements:
    _permission: 'access content'
  options:
    no_cache: 'TRUE'

