ridelog:
  path: '/bike/rides/ridelog'
  defaults:
    _title: 'Ride Log'
    _form: '\Drupal\ridelog\Form\RideLogForm'
  requirements:
    _access: 'TRUE'

ridelog.miles:
  path: '/bike/rides/miles'
  defaults:
    _title: 'Stats'
    _controller: '\Drupal\ridelog\Controller\RidelogController'
  requirements:
    _permission: 'access content'
